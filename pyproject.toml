[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dqn-meent"
version = "0.1.0"
description = "DQN-centered binary metagrating inverse design using MEENT RCWA"
requires-python = ">=3.12,<3.14"
dependencies = [
  "meent==0.13.2",
  "numpy==2.5.3",
  "scipy==1.18.1",
  "gymnasium==1.3.0",
  "torch==2.14.0",
  "matplotlib>=3.10,<4",
  "threadpoolctl>=3.6,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "langgraph>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
dqn-meent = "dqn_meent.cli:main"
grating-lab = "dqn_meent.workspace.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dqn_meent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
